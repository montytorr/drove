version: "0.2"
name: duo
summary: Codex builder plus Codex reviewer
permission_policy: builtin:yolo

pods:
  - id: dev
    label: Project
    members:
      - id: build
        agent_ref: "local:agents/development/implementer"
        runtime: codex
        profile: default
        cwd: "."
      - id: review
        agent_ref: "local:agents/development/qa"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: build
        to: review

edges: []
