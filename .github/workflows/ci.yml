name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The mod's tests (claude plugin test mod) need Claude Code, so they are not run here.
      - run: npm test
